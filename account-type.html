<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Choose your account | RooRide</title>
  <link rel="stylesheet" href="account-type.css?v=5">
</head>
<body>
  <main class="page">
    <header class="top-bar">
      <a class="brand" href="index.html"><img src="logo.png" alt="RooRide"></a>
      <a class="back-home" href="index.html">← Back to home</a>
    </header>

    <p class="step">SIGN UP · STEP 1 OF 2</p>
    <h1>How will you use RooRide?</h1>
    <p class="intro">Choose an account type to get started.</p>

    <section class="account-cards">
      <a class="account-card" href="rider-signup.html">
        <img src="ChatGPT Image Nov 24, 2026, 09_56_59 PM-1.png" alt="Rider getting into a car">
        <div class="card-text">
          <span class="green-line"></span>
          <h2>Rider</h2>
          <p>Find a ride</p>
          <span class="card-arrow" aria-hidden="true">→</span>
        </div>
      </a>

      <a class="account-card" href="driver-signup.html">
        <img src="ChatGPT Image Nov 24, 2026, 09_57_01 PM-2.png" alt="Driver sitting in a car">
        <div class="card-text">
          <span class="green-line"></span>
          <h2>Driver</h2>
          <p>Offer a ride</p>
          <span class="card-arrow" aria-hidden="true">→</span>
        </div>
      </a>
    </section>
