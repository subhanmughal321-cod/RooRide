<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Create your rider account | RooRide</title>
  <link rel="stylesheet" href="rider-signup.css?v=5">
</head>
<body>
  <header class="signup-header"><a href="index.html"><img src="logo.png" alt="RooRide"></a><a class="home-link" href="index.html">← Back to home</a></header>
  <main class="signup-page">
    <p class="progress">━━ Sign up · Step 2 of 2</p>
    <a class="change-link" href="account-type.html">Change account type</a>
    <h1>Create your rider account</h1>
    <p class="note">All fields are required unless marked optional.</p>
    <div class="preview"><strong>Signup preview.</strong> Use sample information only. No data is saved.</div>
    <form id="signup-form" method="post">
      <input type="hidden" name="role" value="rider">
      <section class="form-section">
        <h2>Personal details</h2>
        <div class="field full-width"><label for="full-name">Full name</label><input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Enter full name" required></div>
        <div class="field"><label for="birth-date">Date of birth</label><input id="birth-date" name="birthDate" type="date" required></div>
        <div class="field"><label for="city">City</label><input id="city" name="city" type="text" placeholder="e.g. Gujranwala" required></div>
      </section>
      <section class="form-section">
        <h2>Contact details</h2>
        <div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" autocomplete="tel" placeholder="0300 1234567" required></div>
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      </section>
      <section class="form-section">
        <h2>Account security</h2>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters</small></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      </section>
      <button class="create-button" type="submit" disabled>Create account</button>
      <p id="form-message" role="status" aria-live="polite"></p>
      <noscript>Enable JavaScript to try this demo form.</noscript>
    </form>
  </main>
  <script src="signup.js"></script>
</body>
</html>
